[package]
name = "medis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native egui front end for the Medis Redis GUI"

[[bin]]
name = "medis"
path = "src/main.rs"

[dependencies]
medis-core = { path = "../medis-core" }
eframe = { workspace = true, features = ["clipboard", "links"] }
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
tokio.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
