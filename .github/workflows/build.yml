name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # Oldest supported runner, so the binary runs on older glibc distros too.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: medis
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: medis.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install NASM (aws-lc-rs)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build app
        run: cargo build --release --locked -p medis-app --target ${{ matrix.target }}

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="medis-app"))')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="Medis-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/medis" "dist/$name/"
          cp crates/medis-app/assets/icon-1024.png "dist/$name/medis.png"
          cp packaging/linux/medis.desktop "dist/$name/"
          cp LICENSE* "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Medis-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/medis.exe" "dist/$name/"
          Get-ChildItem LICENSE* -ErrorAction SilentlyContinue | Copy-Item -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: medis-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
